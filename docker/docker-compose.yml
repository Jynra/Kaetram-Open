version: '3.8'

services:
  server:
    build:
      context: ..
      dockerfile: docker/server.Dockerfile
    image: kaetram-server:local
    container_name: kaetram-server
    ports:
      - "3173:3173"
    environment:
      - NODE_ENV=production
    # Mount the .env file where the app reads it (/app/.env)
    volumes:
      - ./../docker/.env.server:/app/.env:ro
    depends_on:
      - mongodb
    restart: unless-stopped

  client:
    build:
      context: ..
      dockerfile: docker/client.Dockerfile
    image: kaetram-client:local
    container_name: kaetram-client
    depends_on:
      - server
    ports:
      - "3174:3174"
    environment:
      - NODE_ENV=production
    env_file:
      - .env.client
    restart: unless-stopped

  # MongoDB
  mongodb:
    image: mongo:4.4
    container_name: kaetram-mongodb
    environment:
      - MONGO_INITDB_DATABASE=kaetram_prod
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
    healthcheck:
      test: ["CMD", "mongo", "--eval", "db.runCommand({ ping: 1 })"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

volumes:
  mongodb_data:

